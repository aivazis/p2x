# install time
[project]
name = "p2x"
dynamic = ["version"]
description = "A framework for building scientific applications"
readme = "README.md"
authors = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
maintainers = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
# the floor: the oldest interpreter the test suite is known to pass under; CI exercises it and
# everything newer (see .github/workflows/mm.yaml)
requires-python = ">=3.14"
keywords = ["science", "framework"]
classifiers = [
    "Development Status :: 6 - Mature",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["ruamel.yaml"]


# pytest runs the same drivers mm does: every file under {tests} is a driver, and its {test}
# functions are the cases; the package under test comes from the install prefix on the path
[tool.pytest.ini_options]
# where the test suites live
testpaths = ["tests"]
# every python file in a suite is a test driver
python_files = ["*.py"]
# import drivers by path, without putting their directories on the module search path
addopts = "--import-mode=importlib -p no:cacheprovider"


# formatting: wrap at column 100
[tool.black]
line-length = 100
# the versions of python the code is formatted for; without an explicit list, black infers
# one from {requires-python} that reaches past the interpreter it runs under
target-version = ["py314"]


# type checking: pyright is the engine of the editor's intellisense, so it sees what the editor
# sees; it reads the sources, since the install prefix holds only bytecode, and finds the package
# there when the drivers import it
[tool.pyright]
include = ["pkg", "tests"]
extraPaths = ["pkg"]
pythonVersion = "3.14"


# the spell check of the prose: {skip} leaves out the binary formats, and {ignore-regex} leaves out
# mixed case identifiers such as {copyIn} or {cellsT}, which are code rather than prose
[tool.codespell]
skip = "*.graffle,*.nb,*.png,*.jpg,*.gif,*.ico,*.pdf,*.svg,*.woff,*.woff2,*.ttf"
ignore-regex = "\\b[a-z]+[A-Z][A-Za-z0-9]*\\b"


# end of file
